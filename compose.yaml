# Local full stack with explicit names. Web and optional tracing UI ports bind only to loopback.
# Secrets are files under the git-ignored .secrets/ directory (scripts/init_secrets.py creates them).
# Model provider and model can be overridden from the shell: MODEL_PROVIDER=copilot COPILOT_MODEL=... docker compose up -d
name: preflight-oss

services:
  preflight-oss-postgres:
    container_name: preflight-oss-postgres
    build:
      context: ./compose/postgres
    environment:
      POSTGRES_DB: preflight_oss
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - preflight-oss-postgres-data:/var/lib/postgresql/data
      - ./compose/postgres-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    secrets:
      - postgres-password
      - api-password
      - mcp-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d preflight_oss"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  preflight-oss-mcp:
    container_name: preflight-oss-mcp
    build:
      context: .
      dockerfile: mcp_service/Dockerfile
    environment:
      PGHOST: preflight-oss-postgres
      PGPORT: "5432"
      PGDATABASE: preflight_oss
      PGUSER: preflight_oss_mcp
      PREFLIGHT_EMBEDDING_MODEL_DIR: /opt/models/bge-small-en-v1.5
      PGPASSWORD_FILE: /run/secrets/mcp-password
      MCP_TOKEN_FILE: /run/secrets/mcp-token
      MCP_ALLOWED_HOSTS: preflight-oss-mcp:*,localhost:*,127.0.0.1:*
    depends_on:
      preflight-oss-postgres:
        condition: service_healthy
    secrets:
      - mcp-password
      - mcp-token

  preflight-oss-api:
    container_name: preflight-oss-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PGHOST: preflight-oss-postgres
      PGPORT: "5432"
      PGDATABASE: preflight_oss
      PGUSER: preflight_oss_api
      PGPASSWORD_FILE: /run/secrets/api-password
      CHAT_TOKEN_FILE: /run/secrets/chat-token
      MCP_TOKEN_FILE: /run/secrets/mcp-token
      COPILOT_TOKEN_FILE: /run/secrets/copilot-token
      MODEL_API_KEY_FILE: /run/secrets/model-api-key
      MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      COPILOT_MODEL: ${COPILOT_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      AWS_REGION: ${AWS_REGION:-}
      CHAT_RUNTIME: ${CHAT_RUNTIME:-copilot}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: preflight-oss-api
      MAX_TOOL_ROUNDS: ${MAX_TOOL_ROUNDS:-6}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-12}
      MCP_AUTH: ${MCP_AUTH:-bearer}
      MCP_TOOL_PREFIX: ${MCP_TOOL_PREFIX:-}
      PREFLIGHT_MCP_URL: ${PREFLIGHT_MCP_URL:-http://preflight-oss-mcp:8001/mcp}
      PREFLIGHT_ALLOWED_HOSTS: preflight-oss-api,localhost,127.0.0.1
    depends_on:
      preflight-oss-postgres:
        condition: service_healthy
      preflight-oss-mcp:
        condition: service_healthy
    secrets:
      - api-password
      - chat-token
      - mcp-token
      - copilot-token
      - model-api-key

  preflight-oss-web:
    container_name: preflight-oss-web
    build:
      context: frontend
    environment:
      API_BASE_URL: http://preflight-oss-api:8000
      PREFLIGHT_ACCESS_KEY_FILE: /run/secrets/chat-token
      PORT: "8080"
      HOST: 0.0.0.0
    depends_on:
      preflight-oss-api:
        condition: service_started
    secrets:
      - chat-token
    ports:
      - "127.0.0.1:8080:8080"

  preflight-oss-jaeger:
    container_name: preflight-oss-jaeger
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    profiles: ['observability']
    expose:
      - "4318"
    ports:
      - "127.0.0.1:16686:16686"

secrets:
  postgres-password:
    file: ./.secrets/postgres-password
  api-password:
    file: ./.secrets/api-password
  mcp-password:
    file: ./.secrets/mcp-password
  chat-token:
    file: ./.secrets/chat-token
  mcp-token:
    file: ./.secrets/mcp-token
  copilot-token:
    file: ./.secrets/copilot-token
  model-api-key:
    file: ./.secrets/model-api-key

volumes:
  preflight-oss-postgres-data: {}

networks:
  default:
    name: preflight-oss
