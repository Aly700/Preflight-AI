# Single-host override behind an existing Nginx: native Bedrock chat with the local UI opt-in.
# Start with: docker compose -f compose.yaml -f deploy/compose.host.yaml up -d
services:
  preflight-oss-api:
    environment:
      CHAT_RUNTIME: ${CHAT_RUNTIME:-native}
      MODEL_PROVIDER: bedrock
      MAX_ANSWERS_PER_DAY: ${MAX_ANSWERS_PER_DAY:-200}
      # Global profile: about 10% cheaper than a geographic one; the data is fictional.
      COPILOT_MODEL: ${COPILOT_MODEL:-global.anthropic.claude-sonnet-4-6}
      AWS_REGION: ${AWS_REGION:-ca-central-1}
      PREFLIGHT_ALLOWED_HOSTS: preflight-oss-api,127.0.0.1,localhost
    ports: ['127.0.0.1:8100:8000']

  preflight-oss-mcp:
    # Loopback only: a TLS listener on the host's private address fronts it for AgentCore Gateway.
    ports: ['127.0.0.1:8101:8001']

  preflight-oss-web:
    profiles: ['local-ui']
